<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARKUS OS — System Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- PIN gate -->
    <div id="pin-gate" class="pin-gate">
        <div class="pin-container">
            <div class="pin-header">
                <div class="pin-logo">◆ MARKUS <b>OS</b></div>
                <p>System Console · authenticate</p>
            </div>
            <div class="pin-input-group">
                <input type="password" id="pin-input" class="pin-input" placeholder="ACCESS KEY" maxlength="6" autocomplete="off">
                <button id="pin-submit" class="pin-submit">→</button>
            </div>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <!-- Console -->
    <div id="console" class="os hidden">
        <aside id="nav" class="os-nav"></aside>
        <div class="os-main">
            <header id="topstrip" class="os-topstrip"></header>
            <main id="view" class="os-view"></main>
        </div>
        <button id="logout-btn" class="os-logout" title="Sign out">⏻</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
