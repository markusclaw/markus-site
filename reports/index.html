<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markus Reports Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pin-gate" class="pin-gate">
        <div class="pin-container">
            <div class="pin-header">
                <h1>Markus Reports</h1>
                <p>Self-Enhancement Log</p>
            </div>
            <div class="pin-input-group">
                <input 
                    type="password" 
                    id="pin-input" 
                    class="pin-input" 
                    placeholder="PIN" 
                    maxlength="6"
                    autocomplete="off"
                >
                <button id="pin-submit" class="pin-submit">→</button>
            </div>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <div id="dashboard" class="dashboard hidden">
        <header class="dashboard-header">
            <h1>Markus Reports Log</h1>
            <button id="logout-btn" class="logout-btn">Sign Out</button>
        </header>

        <div class="dashboard-main">
            <aside class="reports-sidebar">
                <ul class="reports-list" id="reports-list">
                    <li class="loading">Loading...</li>
                </ul>
            </aside>

            <main class="reports-detail" id="reports-detail">
                <div class="no-report-selected">Select a report to view details</div>
            </main>
        </div>
    </div>

    <script src="report.js"></script>
</body>
</html>
