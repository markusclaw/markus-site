<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markus Reports — Self-Enhancement Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pin-gate" class="pin-gate">
        <div class="pin-container">
            <div class="pin-header">
                <h1>Markus Reports</h1>
                <p>Self-Enhancement & Proactive Daemon Dashboard</p>
            </div>
            <div class="pin-input-group">
                <input 
                    type="password" 
                    id="pin-input" 
                    class="pin-input" 
                    placeholder="Enter PIN" 
                    maxlength="6"
                    autocomplete="off"
                >
                <button id="pin-submit" class="pin-submit">Enter</button>
            </div>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <div id="dashboard" class="dashboard hidden">
        <header class="dashboard-header">
            <div class="header-content">
                <h1>Markus Reports</h1>
                <p class="subtitle">Self-Enhancement & Proactive Daemon Metrics</p>
            </div>
            <button id="logout-btn" class="logout-btn">Sign Out</button>
        </header>

        <main class="dashboard-main">
            <div class="controls">
                <div class="filter-group">
                    <label for="date-filter">Filter by date:</label>
                    <input type="date" id="date-filter" class="date-filter">
                </div>
                <div class="stats-summary">
                    <div class="stat-card">
                        <span class="stat-label">Total Reports</span>
                        <span class="stat-value" id="total-reports">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Avg Score</span>
                        <span class="stat-value" id="avg-score">—</span>
                    </div>
                </div>
            </div>

            <div id="reports-container" class="reports-container">
                <!-- Reports loaded here -->
            </div>

            <div id="loading" class="loading">Loading reports...</div>
            <div id="no-reports" class="no-reports hidden">No reports found.</div>
        </main>
    </div>

    <script src="report.js"></script>
</body>
</html>
